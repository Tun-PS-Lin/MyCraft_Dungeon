<!doctype html>

<head>
<script>
  /* the loading card dresses up for a festival before anything else loads (see src/festival.js,
     which leaves a note of today's festival in pv-fest-auto for the next visit) */
  (function () {
    var C = { y: '#ffd84a', Y: '#fff1b0', g: '#2f7a3c', G: '#45a34f', t: '#7a4a22', R: '#e23b3b', B: '#4a9bff', W: '#ffffff',
      p: '#ff6f8a', P: '#d6213f', l: '#ffd1dc', o: '#ff9a2e', O: '#ffcf4a', d: '#8a2a1a', k: '#2a1a12', c: '#c9ced6', s: '#9aa3ae', a: '#7fc8ef',
      e: '#a9dcff', f: '#ffb3c7', h: '#fff1a6', m: '#b8e6c9', v: '#c8b6ff' };
    var T = {
      christmas: ['.......y........', '......yYy.......', '.......y........', '.......g........', '......gGg.......', '.....gRgGg......', '......gGg.......', '.....gGgBgg.....', '....gGgggGgg....', '.....gYgGgg.....', '....gGgggRggg...', '...gGgBggggGgg..', '..ggGgggYgggGgg.', '.......tt.......', '.......tt.......', '................'],
      valentine: ['................', '..PPP.....PPP...', '.PpppP...PpppP..', 'PpplppP.PppppppP', 'PplpppPPPpppppP.', 'PppppppppppppppP', 'PppppppppppppppP', '.PppppppppppppP.', '..PppppppppppP..', '...PpppppppppP..', '....PppppppP....', '.....PpppppP....', '......PpppP.....', '.......PpP......', '........P.......', '................'],
      easter: ['................', '......ffff......', '.....ffffff.....', '....hhhhhhhh....', '....eeWeeWee....', '...eeeeeeeeee...', '...vvvvvvvvvv...', '...vWvvWvvWvv...', '...mmmmmmmmmm...', '...mmmmmmmmmm...', '....ffWffWff....', '....ffffffff....', '.....hhhhhh.....', '......hhhh......', '................', '................'],
      thingyan: ['....y.G.y.......', '...yGyGyGy......', '..yGyyGyyGy.....', '...GyGGyGG......', '......G.........', '..cccccccccccc..', '.ccaaaaaaaaaacc.', '.cccccccccccccc.', '..cccccccccccc..', '...cccccccccc...', '....s......s....', '................', '..a....a....a...', '................', '.a....a....a....', '................'],
      thadingyut: ['.......k........', '.......k........', '.....dddddd.....', '....oooooooo....', '...oOoooooOoo...', '...oOOoooOOoo...', '...ooOOoOOooo...', '...ooooOooooo...', '...oOoooooOoo...', '....oooooooo....', '.....dddddd.....', '.......R........', '......RRR.......', '.......R........', '................', '................'],
    };
    function icon(rows) {
      var r = '';
      for (var y = 0; y < rows.length; y++) for (var x = 0; x < rows[y].length; x++) { var ch = rows[y][x]; if (C[ch]) r += '<rect x="' + x + '" y="' + y + '" width="1" height="1" fill="' + C[ch] + '"/>'; }
      return 'url("data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">' + r + '</svg>') + '")';
    }
    window.__festTheme = function (id) {
      var h = document.documentElement;
      if (!id || !T[id]) { h.removeAttribute('data-fest'); return; }
      h.setAttribute('data-fest', id); h.style.setProperty('--fest-icon', icon(T[id]));
    };
    var id = null;
    try {
      var c = localStorage.getItem('pv-festival') || 'auto', now = new Date(), m = now.getMonth(), d = now.getDate();
      if (c !== 'auto' && c !== 'off') id = c;
      else if (c === 'auto') {
        var a = JSON.parse(localStorage.getItem('pv-fest-auto') || 'null');
        if (a && a.day === now.toDateString()) id = a.id;
        else if (m === 11 || (m === 0 && d <= 6)) id = 'christmas';
        else if (m === 1 && d >= 7 && d <= 15) id = 'valentine';
        else if (m === 3 && d >= 11 && d <= 17) id = 'thingyan';
      }
    } catch (e) { /* storage unavailable */ }
    window.__festTheme(id);
  })();
</script>

<script>
  // if the village fails to start, offer the simple version on the title card instead of a blank page
  // (with the reason in small print, so it can be reported). Errors from browser extensions, and
  // anything after the village is up, are left alone.
  window.__villageFail = function (why) {
    var s = document.getElementById('introState'), w = document.getElementById('introWhy');
    if (!s || window.__villageUp) return;
    document.documentElement.classList.add('broken'); s.textContent = 'The village could not start on this device.';
    if (w && why) { w.textContent = why; w.hidden = false; }
  };
  // after a festival change, the title card says what is happening
  try { var lt = sessionStorage.getItem('pv-loading'); if (lt) { sessionStorage.removeItem('pv-loading'); document.getElementById('introState').textContent = lt; } } catch (e) { /* ignore */ }
  addEventListener('error', function (e) {
    var f = e.filename || '';
    if (f && f.indexOf(location.origin) !== 0) return;
    if (!e.error && /^Script error/.test(e.message || '')) return;
    window.__villageFail((e.message || 'Unknown error') + (f ? ' (' + f.split('/').pop() + ':' + e.lineno + ')' : ''));
  });
</script>
